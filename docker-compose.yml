services:
  api:
    container_name: ciphervault-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Override path agar konsisten di dalam container
      DATABASE_URL: "sqlite:///./data/ciphervault.db"
      STORAGE_PATH: "./data/storage"
      RSA_PRIVATE_KEY_PATH: "./data/keys/private.pem"
      RSA_PUBLIC_KEY_PATH: "./data/keys/public.pem"
    volumes:
      - ./data:/app/data
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
