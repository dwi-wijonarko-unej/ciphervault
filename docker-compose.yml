services:
  db:
    image: postgres:16-alpine
    container_name: ciphervault-db
    environment:
      POSTGRES_USER: ciphervault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ciphervault_change_me}
      POSTGRES_DB: ciphervault
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciphervault -d ciphervault"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # Jangan expose ke publik di production; hanya antar-container.
    # Hapus komentar baris berikut jika perlu akses dari host untuk debugging:
    # ports:
    #   - "5432:5432"

  api:
    container_name: ciphervault-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      # PostgreSQL sebagai database utama (production-grade).
      # Bisa di-override lewat .env jika ingin pakai SQLite untuk testing.
      DATABASE_URL: "postgresql+psycopg2://ciphervault:${POSTGRES_PASSWORD:-ciphervault_change_me}@db:5432/ciphervault"
      STORAGE_PATH: "./data/storage"
      RSA_PRIVATE_KEY_PATH: "./data/keys/private.pem"
      RSA_PUBLIC_KEY_PATH: "./data/keys/public.pem"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
