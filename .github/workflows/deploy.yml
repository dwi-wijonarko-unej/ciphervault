name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST || secrets.SSH_HOST || '43.156.234.238' }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER || 'dwijonarko' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || secrets.SSH_PORT || 22 }}
          script: |
            set -e
            PROJECT_PATH="${{ vars.PROJECT_PATH || '/opt/ciphervault' }}"
            cd "$PROJECT_PATH"
            echo ">>> Updating code from GitHub"
            # Support both normal clone and bare-repo worktree (/opt/ciphervault.git)
            if [ -d ".git" ]; then
              git fetch origin main
              git checkout main || git checkout -b main origin/main
              git pull origin main
            else
              GIT_WORK_TREE="$PROJECT_PATH" GIT_DIR=/opt/ciphervault.git git fetch origin main || git fetch origin main
              GIT_WORK_TREE="$PROJECT_PATH" GIT_DIR=/opt/ciphervault.git git checkout -f main || git checkout -f main
            fi
            echo ">>> Rebuilding containers"
            docker compose up -d --build
            docker image prune -f
            echo ">>> Health check"
            curl -fsS http://127.0.0.1:3000/health/ready || curl -fsS http://127.0.0.1:8000/health/ready || true
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
