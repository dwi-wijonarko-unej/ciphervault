    <!-- Inline script to prevent theme & language flash -->
    <script>
      (function () {
        var saved = localStorage.getItem("cv_theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var isDark = saved !== null ? saved === "dark" : prefersDark;
        document.documentElement.classList.toggle("dark", isDark);

        var savedLang = localStorage.getItem("cv_lang");
        var lang = savedLang || (navigator.language.startsWith("id") ? "id" : "en");
        document.documentElement.lang = lang;
        document.documentElement.setAttribute("data-lang", lang);
      })();
    </script>
    <!-- Fonts: Space Grotesk (headings) + Inter (body) - font-display swap prevents FOIT -->
