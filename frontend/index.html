<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CipherVault — Secure Cloud Storage</title>
    <!-- Inline script to prevent theme flash: restore saved theme BEFORE render -->
    <script>
      (function () {
        var saved = localStorage.getItem("cv_theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var isDark = saved !== null ? saved === "dark" : prefersDark;
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
    <!-- Fonts: Space Grotesk (headings) + Inter (body) - font-display swap prevents FOIT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: {
                DEFAULT: "var(--surface)",
                card: "var(--surface-card)",
                hover: "var(--surface-hover)",
                input: "var(--surface-input)",
              },
              border: {
                DEFAULT: "var(--border)",
                focus: "#2d6a4f",
              },
              muted: "var(--muted)",
              body: "var(--bg-body)",
              primary: "var(--text-primary)",
              secondary: "var(--text-secondary)",
            },
            fontFamily: {
              heading: ['"Space Grotesk"', "system-ui", "sans-serif"],
              sans: ["Inter", "system-ui", "sans-serif"],
            },
            boxShadow: {
              sharp: "4px 4px 0px 0px rgba(0,0,0,0.15)",
              "sharp-hover": "6px 6px 0px 0px rgba(0,0,0,0.2)",
              soft: "0 2px 8px rgba(0,0,0,0.06)",
            },
            borderRadius: {
              sharp: "0",
              pill: "9999px",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/style.css?v=20260804" />
    <link rel="stylesheet" href="css/components.css?v=20260804" />
    <link rel="stylesheet" href="css/animations.css?v=20260804" />
  </head>
  <body class="bg-body text-primary min-h-screen">
    <!-- Navbar — solid primary logo, no gradients -->
    <nav
      class="bg-surface border-b border-border h-16 flex items-center justify-between px-6 sticky top-0 z-50"
    >
      <div class="flex items-center gap-2.5 font-bold text-lg">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="var(--primary)"
          stroke-width="1.5"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <span class="font-heading" style="color: var(--primary)"
          >CipherVault</span
        >
      </div>
      <div class="flex items-center gap-1.5">
        <button
          class="p-2 rounded-md text-muted hover:text-primary hover:bg-surface-hover transition-all cursor-pointer bg-transparent border-none"
          id="btn-theme"
          title="Toggle theme"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            id="theme-icon-sun"
          >
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            id="theme-icon-moon"
            class="hidden"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
        <span
          id="nav-role"
          class="text-xs font-semibold px-2 py-0.5 rounded-md uppercase tracking-wide hidden sm:inline-flex"
          style="display: none"
          >user</span
        >
        <button
          class="p-2 rounded-md text-muted hover:text-primary hover:bg-surface-hover transition-all cursor-pointer bg-transparent border-none"
          id="btn-profile"
          title="Profile & API Keys"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </button>
        <span id="nav-username" class="text-muted text-sm hidden sm:inline"
          >User</span
        >
        <span
          class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white cursor-pointer"
          id="nav-avatar"
          style="background: var(--primary)"
          onclick="App.navigate('profile')"
          >U</span
        >
        <button
          class="p-2 rounded-md text-muted hover:text-primary hover:bg-surface-hover transition-all cursor-pointer bg-transparent border-none"
          id="btn-logout"
          title="Logout"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>
    </nav>

    <!-- Tabs — active state with bottom border -->
    <div class="bg-surface border-b border-border px-6">
      <div class="max-w-[1200px] mx-auto flex gap-0">
        <button
          class="flex items-center gap-1.5 px-5 py-3 text-sm font-medium transition-all nav-tab active relative"
          data-nav="dashboard"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
            />
          </svg>
          My Files
          <span
            class="absolute bottom-0 left-3 right-3 h-0.5 bg-primary rounded-full scale-x-0 tab-active-bar transition-transform duration-200"
          ></span>
        </button>
        <button
          class="flex items-center gap-1.5 px-5 py-3 text-sm font-medium transition-all nav-tab relative"
          data-nav="shared"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
          </svg>
          Shared with Me
          <span
            class="absolute bottom-0 left-3 right-3 h-0.5 bg-primary rounded-full scale-x-0 tab-active-bar transition-transform duration-200"
          ></span>
        </button>
        <button
          class="flex items-center gap-1.5 px-5 py-3 text-sm font-medium transition-all nav-tab relative"
          data-nav="system"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          System
          <span
            class="absolute bottom-0 left-3 right-3 h-0.5 bg-primary rounded-full scale-x-0 tab-active-bar transition-transform duration-200"
          ></span>
        </button>
        <button
          class="flex items-center gap-1.5 px-5 py-3 text-sm font-medium transition-all nav-tab relative"
          data-nav="activity"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
          Activity
          <span
            class="absolute bottom-0 left-3 right-3 h-0.5 bg-primary rounded-full scale-x-0 tab-active-bar transition-transform duration-200"
          ></span>
        </button>
        <button
          class="flex items-center gap-1.5 px-5 py-3 text-sm font-medium transition-all nav-tab relative"
          data-nav="admin"
          style="display: none"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <polyline points="9 12 11 14 15 10" transform="translate(0,-0.5)" />
          </svg>
          Admin
          <span
            class="absolute bottom-0 left-3 right-3 h-0.5 bg-primary rounded-full scale-x-0 tab-active-bar transition-transform duration-200"
          ></span>
        </button>
      </div>
    </div>

    <!-- Content -->
    <main class="max-w-[1200px] mx-auto px-6 py-6">
      <div id="view-container"></div>
    </main>

    <div
      id="toast-container"
      class="fixed top-5 right-5 z-[9999] flex flex-col gap-2"
    ></div>

    <script src="js/theme.js?v=20260804"></script>
    <script src="js/api.js?v=20260804"></script>
    <script src="js/ui.js?v=20260804"></script>
    <script src="js/auth.js?v=20260804"></script>
    <script src="js/files.js?v=20260804"></script>
    <script src="js/upload.js?v=20260804"></script>
    <script src="js/download.js?v=20260804"></script>
    <script src="js/share.js?v=20260804"></script>
    <script src="js/search.js?v=20260804"></script>
    <script src="js/security.js?v=20260804"></script>
    <script src="js/system.js?v=20260804"></script>
    <script src="js/directory.js?v=20260804"></script>
    <script src="js/profile.js?v=20260804"></script>
    <script src="js/admin.js?v=20260804"></script>
    <script src="js/app.js?v=20260804"></script>
  </body>
</html>
