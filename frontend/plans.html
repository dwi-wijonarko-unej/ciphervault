<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paket Langganan — CipherVault</title>
  <script>
    (function () {
      var saved = localStorage.getItem("cv_theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var isDark = saved !== null ? saved === "dark" : prefersDark;
      document.documentElement.classList.toggle("dark", isDark);
      var lang = localStorage.getItem("cv_lang");
      if (!lang) { var nav = navigator.language || ""; lang = nav.startsWith("id") ? "id" : "en"; }
      document.documentElement.lang = lang;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: { DEFAULT: "var(--surface)", card: "var(--surface-card)", hover: "var(--surface-hover)", input: "var(--surface-input)" },
            border: { DEFAULT: "var(--border)", focus: "#2d6a4f" },
            muted: "var(--muted)", body: "var(--bg-body)", primary: "var(--text-primary)", secondary: "var(--text-secondary)",
          },
          fontFamily: { heading: ['"Space Grotesk"', "system-ui", "sans-serif"], sans: ["Inter", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css?v=20260804" />
  <link rel="stylesheet" href="css/components.css?v=20260804" />
  <link rel="stylesheet" href="css/animations.css?v=20260804" />
</head>
<body class="bg-body text-primary min-h-screen">
  <nav class="bg-surface border-b border-border h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <a href="index.html" class="flex items-center gap-2.5 font-bold text-lg">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
      <span class="font-heading" style="color: var(--primary)">CipherVault</span>
    </a>
    <div class="flex items-center gap-2">
      <a href="index.html" class="text-sm text-muted hover:text-primary px-3 py-1.5" data-i18n="nav.my_files">Dasbor</a>
      <a href="plans.html" class="text-sm font-semibold text-primary px-3 py-1.5 border-b-2 border-primary" data-i18n="nav.plans">Paket</a>
      <a href="index.html#billing" id="nav-my-subscription" class="text-sm text-muted hover:text-primary px-3 py-1.5 hidden" data-i18n="nav.my_subscription">Langganan Saya</a>
      <div class="lang-switcher flex items-center bg-surface-card border border-border rounded-md overflow-hidden"></div>
      <button class="p-2 rounded-md text-muted hover:text-primary hover:bg-surface-hover" id="btn-theme" title="Toggle theme"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="theme-icon-sun"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="theme-icon-moon" class="hidden"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <a href="login.html" id="nav-login" class="ml-2 px-4 py-2 rounded-md text-sm font-semibold text-white" style="background:var(--primary)" data-i18n="auth.sign_in">Masuk</a>
    </div>
  </nav>

  <main class="max-w-[1100px] mx-auto px-6 py-8">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-black font-heading tracking-tight" data-i18n="plans.title">Pilih Paket yang Tepat</h1>
      <p class="text-sm text-muted mt-2" data-i18n="plans.subtitle">Semua paket dilindungi enkripsi UHC + AES hybrid. Upgrade kapan saja.</p>
    </div>
    <div id="plans" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    <p id="plans-error" class="text-center text-sm text-muted mt-6 hidden" data-i18n="plans.load_error">Gagal memuat paket.</p>
  </main>

  <div id="checkout-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[8000] hidden flex items-center justify-center p-5" onclick="if(event.target===this)closeCheckoutModal()">
    <div class="bg-surface-card border border-border rounded-xl shadow-2xl w-full max-w-[420px] p-6">
      <h3 class="text-lg font-bold mb-2" id="checkout-plan-name">Paket</h3>
      <p class="text-sm text-muted mb-4" id="checkout-plan-desc"></p>
      <div class="flex gap-3">
        <button class="flex-1 py-2.5 rounded-md text-sm font-semibold text-white" style="background:var(--primary)" id="btn-confirm-checkout" data-i18n="plans.confirm">Konfirmasi</button>
        <button class="flex-1 py-2.5 rounded-md text-sm font-medium border border-border" onclick="closeCheckoutModal()" data-i18n="common.cancel">Batal</button>
      </div>
      <p class="text-xs text-muted mt-3" data-i18n="plans.login_required">Login diperlukan untuk berlangganan.</p>
    </div>
  </div>

  <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2"></div>

  <script src="js/theme.js?v=20260920"></script>
  <script src="js/i18n.js?v=20260920"></script>
  <script src="js/api.js?v=20260920"></script>
  <script src="js/ui.js?v=20260920"></script>
  <script src="js/plans.js?v=20260920"></script>
</body>
</html>
