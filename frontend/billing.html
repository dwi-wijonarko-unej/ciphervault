<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Langganan & Tagihan — CipherVault</title>
  <script>
    (function () {
      var saved = localStorage.getItem("cv_theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var isDark = saved !== null ? saved === "dark" : prefersDark;
      document.documentElement.classList.toggle("dark", isDark);
      var lang = localStorage.getItem("cv_lang");
      if (!lang) { var nav = navigator.language || ""; lang = nav.startsWith("id") ? "id" : "en"; }
      document.documentElement.lang = lang;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: { DEFAULT: "var(--surface)", card: "var(--surface-card)", hover: "var(--surface-hover)", input: "var(--surface-input)" },
            border: { DEFAULT: "var(--border)", focus: "#2d6a4f" },
            muted: "var(--muted)", body: "var(--bg-body)", primary: "var(--text-primary)", secondary: "var(--text-secondary)",
          },
          fontFamily: { heading: ['"Space Grotesk"', "system-ui", "sans-serif"], sans: ["Inter", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css?v=20260804" />
  <link rel="stylesheet" href="css/components.css?v=20260804" />
  <link rel="stylesheet" href="css/animations.css?v=20260804" />
</head>
<body class="bg-body text-primary min-h-screen">
  <nav class="bg-surface border-b border-border h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <a href="index.html" class="flex items-center gap-2.5 font-bold text-lg">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
      <span class="font-heading" style="color: var(--primary)">CipherVault</span>
    </a>
    <div class="flex items-center gap-2">
      <a href="index.html" class="text-sm text-muted hover:text-primary px-3 py-1.5">Dasbor</a>
      <a href="billing.html" class="text-sm font-semibold text-primary px-3 py-1.5 border-b-2 border-primary">Langganan</a>
      <button class="p-2 rounded-md text-muted hover:text-primary hover:bg-surface-hover" id="btn-theme" title="Toggle theme"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="theme-icon-sun"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="theme-icon-moon" class="hidden"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </div>
  </nav>

  <main class="max-w-[1100px] mx-auto px-6 py-8">
    <h1 class="text-3xl font-black font-heading tracking-tight mb-6">Langganan & Tagihan</h1>

    <section id="current-plan" class="bg-surface-card border border-border rounded-lg p-6 mb-6">
      <h2 class="text-lg font-bold mb-3">Paket Saat Ini</h2>
      <p id="plan-info" class="text-sm text-secondary">Memuat...</p>
      <p id="usage-info" class="text-sm text-muted mt-2"></p>
      <button id="btn-cancel" class="mt-4 px-4 py-2 rounded-md text-sm font-medium bg-red-500 text-white hover:bg-red-600 hidden">Batalkan Langganan</button>
    </section>

    <section class="bg-surface-card border border-border rounded-lg p-6 mb-6">
      <h2 class="text-lg font-bold mb-4">Pilih Paket</h2>
      <div id="plans" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </section>

    <section class="bg-surface-card border border-border rounded-lg p-6">
      <h2 class="text-lg font-bold mb-4">Riwayat Tagihan</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm"><thead><tr class="text-left text-muted border-b border-border"><th class="pb-2 font-medium">Nomor</th><th class="pb-2 font-medium">Jumlah</th><th class="pb-2 font-medium">PPN</th><th class="pb-2 font-medium">Status</th><th class="pb-2 font-medium">Aksi</th></tr></thead><tbody id="invoices" class="divide-y divide-border"></tbody></table>
      </div>
    </section>
  </main>

  <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2"></div>

  <script src="js/theme.js?v=20260805"></script>
  <script src="js/api.js?v=20260805"></script>
  <script src="js/ui.js?v=20260805"></script>
  <script src="js/auth.js?v=20260805"></script>
  <script src="js/billing.js?v=20260805"></script>
  <script>
    if (!localStorage.getItem('cv_token') && !localStorage.getItem('token')) {
      // allow load anyway, billing.js will show error, but redirect to login if unauth
      // uncomment to enforce redirect:
      // window.location.href = 'login.html';
    }
    document.getElementById('btn-theme')?.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('cv_theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-icon-sun').classList.toggle('hidden', isDark);
      document.getElementById('theme-icon-moon').classList.toggle('hidden', !isDark);
    });
  </script>
</body>
</html>
